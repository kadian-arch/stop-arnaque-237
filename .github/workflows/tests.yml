name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:       # "Run workflow" button on the Actions tab
  schedule:
    - cron: "0 6 * * 1"    # every Monday, so a broken dependency shows up even when nobody pushes

jobs:
  # "test" is the required status check in the main branch ruleset: keep this job name
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # the Windows-only screenshot OCR test skips itself here
      - run: python -m pipeline test

  other-pythons:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pipeline test
